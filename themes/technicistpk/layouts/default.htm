description = "Default Layout"
==
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% if this.page.meta_title %}{{ this.page.meta_title }}{% else %}{{ this.theme.seo_title_default }}{% endif %}</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="{% if this.page.meta_description %}{{ this.page.meta_description }}{% else %}{{ this.theme.seo_description_default }}{% endif %}">
    <meta name="keywords" content="{% if this.page.meta_keywords %}{{ this.page.meta_keywords }}{% else %}{{ this.theme.seo_keywords_default }}{% endif %}">
    
    <!-- OpenGraph / SEO -->
    <meta property="og:title" content="{% if this.page.meta_title %}{{ this.page.meta_title }}{% else %}{{ this.theme.seo_title_default }}{% endif %}">
    <meta property="og:description" content="{% if this.page.meta_description %}{{ this.page.meta_description }}{% else %}{{ this.theme.seo_description_default }}{% endif %}">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link href="{{ 'assets/img/favicon.ico'|theme }}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{{ 'assets/lib/animate/animate.min.css'|theme }}" rel="stylesheet">
    <link href="{{ 'assets/lib/owlcarousel/assets/owl.carousel.min.css'|theme }}" rel="stylesheet">
    <link href="{{ 'assets/lib/lightbox/css/lightbox.min.css'|theme }}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{{ 'assets/css/bootstrap.min.css'|theme }}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{{ 'assets/css/style.css'|theme }}" rel="stylesheet">
    {% styles %}
</head>
<body>
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Header Partial -->
    {% partial 'header' %}

    <!-- Page Content -->
    {% page %}

    <!-- Footer Partial -->
    {% partial 'footer' %}

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top"><i class="bi bi-arrow-up"></i></a>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ 'assets/lib/wow/wow.min.js'|theme }}"></script>
    <script src="{{ 'assets/lib/easing/easing.min.js'|theme }}"></script>
    <script src="{{ 'assets/lib/waypoints/waypoints.min.js'|theme }}"></script>
    <script src="{{ 'assets/lib/counterup/counterup.min.js'|theme }}"></script>
    <script src="{{ 'assets/lib/owlcarousel/owl.carousel.min.js'|theme }}"></script>
    <script src="{{ 'assets/lib/isotope/isotope.pkgd.min.js'|theme }}"></script>
    <script src="{{ 'assets/lib/lightbox/js/lightbox.min.js'|theme }}"></script>

    <!-- Template Javascript -->
    <script src="{{ 'assets/js/main.js'|theme }}"></script>
    {% scripts %}
</body>
</html>
